[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "AI pull request reviewer that runs as a CLI and as a GitHub Action"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Rajiv Nagula" }]
keywords = ["code-review", "github-actions", "llm", "developer-tools"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
pr-review = "pr_review.cli:main"

[project.urls]
Repository = "https://github.com/Sairajiv-13/pr-review-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pr_review"]
